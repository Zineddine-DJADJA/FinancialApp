    <meta name="description" content="Suivi des dépenses du quotidien, hors ligne." />
    <meta name="theme-color" content="#E3F4B0" />

    <!-- iPhone : installation « Sur l'écran d'accueil » en plein écran -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pousse" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="logo.svg" type="image/svg+xml" />

    <style>

      html { background: #E3F4B0; }

    </style>
  </head>
